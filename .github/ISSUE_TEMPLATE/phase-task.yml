name: Phase task
description: 현재 버전과 Phase에 속한 구현·검증 작업
title: "[phase] "
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - 1phase
        - 2phase
        - 3phase
        - 4phase
        - 5phase
    validations:
      required: true
  - type: input
    id: task_ids
    attributes:
      label: Task IDs
      placeholder: "LC-030-P2-01, LC-030-P2-02"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected paths
      description: 포함 범위, 제외 범위, 수정할 파일 경계를 적습니다.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: 완료되어야 할 Phase, ADR, schema 또는 다른 작업을 적습니다.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: 완료 여부를 재현할 수 있는 확인 방법을 적습니다.
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: 현재 STATUS와 Phase 문서를 확인했습니다.
          required: true
        - label: 다른 활성 작업과 파일 범위가 겹치지 않습니다.
          required: true
        - label: 실제 사용자 자료나 비밀 값을 사용하지 않습니다.
          required: true
