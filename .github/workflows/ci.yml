name: CI

on:
  pull_request:
  push:
    branches: [main, "phase/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: lyricscloud_test
          POSTGRES_USER: lyricscloud_test
          POSTGRES_PASSWORD: lyricscloud_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyricscloud_test -d lyricscloud_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://lyricscloud_test:lyricscloud_test_only@127.0.0.1:5432/lyricscloud_test
      AUTH_DATABASE_INTEGRATION: "true"
      APP_VERSION: 0.1.0
      BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations twice
        run: pnpm migrate && pnpm migrate
      - name: Static checks
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Auth and ownership E2E
        env:
          E2E_DATABASE_URL: postgresql://lyricscloud_test:lyricscloud_test_only@127.0.0.1:5432/lyricscloud_test
        run: pnpm test:e2e
      - name: Scan build artifacts for auth secrets
        env:
          GOOGLE_CLIENT_SECRET: synthetic-e2e-client-secret
          SESSION_SECRET: synthetic-e2e-session-secret-at-least-32-bytes
          E2E_PROVIDER_TOKEN: synthetic-provider-token-never-persisted
        run: pnpm check:secrets apps/web/.next
