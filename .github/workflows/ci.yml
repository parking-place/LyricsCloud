name: CI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested commit to Docker Hub
        required: true
        type: boolean
        default: false
      release:
        description: Add Release and latest tags; requires an exact vVERSION Git tag
        required: true
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, "phase/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: lyricscloud_test
          POSTGRES_USER: lyricscloud_test
          POSTGRES_PASSWORD: lyricscloud_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lyricscloud_test -d lyricscloud_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://lyricscloud_test:lyricscloud_test_only@127.0.0.1:5432/lyricscloud_test
      AUTH_DATABASE_INTEGRATION: "true"
      APP_VERSION: 1.0.8
      BUILD_ID: ${{ github.sha }}
      APP_CHANNEL: dev
      APP_PHASE: p3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: P6 stabilization regression
        run: node --test scripts/tests/p6-*.mjs
      - name: P6 whole-tree codebase inventory and syntax audit
        run: node scripts/audit-p6-codebase.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          --redact --no-banner git .
      - name: Apply migrations twice
        run: pnpm migrate && pnpm migrate
      - name: Verify 0.2.0 Phase 1 migration recovery
        run: pnpm test:migration:0200
      - name: Verify 0.2.0 Phase 2 migration recovery
        run: pnpm test:migration:0201
      - name: Verify 0.3.0 lyrics migration recovery
        run: pnpm test:migration:0300
      - name: Verify 0.3.1 CRDT sync migration recovery
        run: pnpm test:migration:0310
      - name: Verify 0.3.1 revision migration recovery
        run: pnpm test:migration:0311
      - name: Verify 0.4.0 rhyme migration recovery
        run: pnpm test:migration:0400
      - name: Verify 0.5.0 prompt migration recovery
        run: pnpm test:migration:0500
      - name: Verify 0.5.0 prompt usage migration recovery
        run: pnpm test:migration:0501
      - name: Verify 0.7.0 search foundation migration recovery
        run: pnpm test:migration:0700
      - name: Verify 0.7.0 recent search migration recovery
        run: pnpm test:migration:0701
      - name: Verify 0.7.0 recent item migration recovery
        run: pnpm test:migration:0702
      - name: Verify 0.8.0 template migration recovery
        run: pnpm test:migration:0800
      - name: Verify 0.8.0 display settings migration recovery
        run: pnpm test:migration:0801
      - name: Verify 0.8.0 lifecycle migration recovery
        run: pnpm test:migration:0802
      - name: Verify 1.0.1 beta migration and administrator contracts
        run: pnpm test:migration:0900 && pnpm test:migration:0901 && pnpm test:beta-admin:0900 && pnpm test:beta-signup:0901
      - name: Verify 1.0.3 prompt mode migration recovery
        run: pnpm test:migration:1000
      - name: Verify 1.0.7 library view migration recovery
        run: pnpm test:migration:1001
      - name: Verify 1.0.8 manual library order migration recovery
        run: pnpm test:migration:1002
      - name: Verify 0.7.0 fresh and 0.6.0 upgrade release paths
        run: pnpm test:migration:0700-release
      - name: Measure 0.7.0 navigation release baseline
        run: pnpm test:performance:0700-release
      - name: Static checks
        run: pnpm check
      - name: Verify 0.9.0 UI audit baseline
        run: pnpm test:audit:0901 && pnpm test:release:0905
      - name: Shell and Docker cleanup contract
        run: |
          for script in scripts/*.sh infra/backup/*.sh; do
            bash -n "$script"
          done
          ./scripts/cleanup-docker.sh --dry-run --build-cache
          test "$(./scripts/docker-image-tag.sh branch phase/0.9.1-p2-security-hardening 0123456789abcdef0123456789abcdef01234567 web dev)" = "0.9.1"
          test "$(./scripts/docker-image-tag.sh tag v0.9.1 0123456789abcdef0123456789abcdef01234567 web release)" = "0.9.1"
          if ./scripts/docker-image-tag.sh tag v0.9.1 0123456789abcdef0123456789abcdef01234567 web dev; then exit 1; fi
          if ./scripts/docker-image-tag.sh branch main 0123456789abcdef0123456789abcdef01234567 web release; then exit 1; fi
      - name: Unit tests
        run: pnpm test
      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Verify 0.9.0 PWA cache contract
        run: pnpm test:pwa:0903
      - name: Verify 0.9.1 RC feature freeze
        run: pnpm test:freeze:0911
      - name: Verify 0.9.1 security hardening
        run: pnpm test:security:0912
      - name: Verify 0.9.1 performance contract
        run: pnpm test:release:0913
      - name: Measure 0.9.1 three-round performance budgets
        run: pnpm test:performance:0913
      - name: Verify 0.9.1 privacy-first observability
        run: pnpm test:release:0914 && pnpm test:observability:0914
      - name: Verify 0.9.1 backup, restore and artifact contract
        run: pnpm test:release:0915
      - name: Verify final candidate and sealed release contracts
        if: env.APP_PHASE == 'p5'
        run: pnpm test:release:1001 && pnpm test:release:1002 && pnpm test:release:1004 && pnpm test:release:1005 && pnpm test:environment:101
      - name: Build development server production image
        run: docker build --file infra/docker/Dockerfile.web --tag lyricscloud-web-ci:${{ github.sha }} .
      - name: Build production service images
        run: |
          for service in collaboration worker migrate; do
            docker build --file infra/docker/Dockerfile.service --target "$service" --tag "lyricscloud-$service-ci:${{ github.sha }}" .
          done
          docker build --file infra/backup/Dockerfile --tag lyricscloud-backup-ci:${{ github.sha }} .
      - name: Run production images with a fresh database
        run: bash scripts/verify-production-images.sh "${{ github.sha }}"
      - name: Exercise encrypted backup and isolated restore
        run: bash scripts/verify-0915-backup-restore.sh "${{ github.sha }}"
      - name: Exercise previous RC upgrade and rollback
        run: bash scripts/verify-0915-upgrade-rollback.sh "${{ github.sha }}"
      - name: Scan production images for fixable high or critical vulnerabilities
        env:
          TRIVY_CACHE_PATH: /tmp/lyricscloud-trivy-cache
        run: bash scripts/scan-container-vulnerabilities.sh "${{ github.sha }}"
      - name: Scan production image layers for secret canaries
        env:
          GOOGLE_CLIENT_SECRET: synthetic-e2e-client-secret
          SESSION_SECRET: synthetic-e2e-session-secret-at-least-32-bytes
          E2E_PROVIDER_TOKEN: synthetic-provider-token-never-persisted
        run: bash scripts/scan-container-secrets.sh "${{ github.sha }}"
      - name: Install Playwright Chromium, Firefox and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Auth and ownership E2E
        env:
          E2E_DATABASE_URL: postgresql://lyricscloud_test:lyricscloud_test_only@127.0.0.1:5432/lyricscloud_test
        run: pnpm test:e2e
      - name: Release candidate browser matrix
        env:
          E2E_DATABASE_URL: postgresql://lyricscloud_test:lyricscloud_test_only@127.0.0.1:5432/lyricscloud_test
        run: pnpm test:e2e:release:0905
      - name: Scan build artifacts for auth secrets
        env:
          GOOGLE_CLIENT_SECRET: synthetic-e2e-client-secret
          SESSION_SECRET: synthetic-e2e-session-secret-at-least-32-bytes
          E2E_PROVIDER_TOKEN: synthetic-provider-token-never-persisted
        run: pnpm check:secrets apps/web/.next

  publish:
    name: Publish ${{ matrix.service }} image
    needs: verify
    # P6 must not auto-publish or move another developer's channel before handoff.
    if: >-
      ((github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/phase/1.0.0-p6-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && vars.DOCKERHUB_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: infra/docker/Dockerfile.web
            target: runtime
          - service: collaboration
            dockerfile: infra/docker/Dockerfile.service
            target: collaboration
          - service: worker
            dockerfile: infra/docker/Dockerfile.service
            target: worker
          - service: migrate
            dockerfile: infra/docker/Dockerfile.service
            target: migrate
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - name: Resolve tag channel
        id: version
        run: |
          channel=dev
          if [ "${{ inputs.release }}" = "true" ]; then channel=release; fi
          version=$(./scripts/docker-image-tag.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ matrix.service }}" "$channel")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Resolve isolated publication tags
        id: publication
        env:
          PUBLICATION_VERSION: ${{ steps.version.outputs.version }}
          PUBLICATION_RELEASE: ${{ inputs.release == true }}
        run: node scripts/image-publication-plan.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: parkingplace/lyricscloud-${{ matrix.service }}
          flavor: latest=false
          tags: ${{ steps.publication.outputs.tags }}
          labels: |
            org.opencontainers.image.title=LyricsCloud ${{ matrix.service }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push multi-tagged image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=lyricscloud-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=lyricscloud-${{ matrix.service }}
      - name: Sign and verify exact image artifact
        env:
          IMAGE: parkingplace/lyricscloud-${{ matrix.service }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_TARGET: ${{ matrix.target }}
        run: bash scripts/verify-image-artifact.sh
