name: CI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested commit to Docker Hub
        required: true
        type: boolean
        default: false
      release:
        description: Add Release and latest tags; requires an exact vVERSION Git tag
        required: true
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, "phase/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: lyricscloud_test
          POSTGRES_USER: lyricscloud_test
          POSTGRES_PASSWORD: lyricscloud_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lyricscloud_test -d lyricscloud_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://lyricscloud_test:lyricscloud_test_only@127.0.0.1:5432/lyricscloud_test
      AUTH_DATABASE_INTEGRATION: "true"
      APP_VERSION: 0.3.1
      BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations twice
        run: pnpm migrate && pnpm migrate
      - name: Verify 0.2.0 Phase 1 migration recovery
        run: pnpm test:migration:0200
      - name: Verify 0.2.0 Phase 2 migration recovery
        run: pnpm test:migration:0201
      - name: Verify 0.3.0 lyrics migration recovery
        run: pnpm test:migration:0300
      - name: Verify 0.3.1 CRDT sync migration recovery
        run: pnpm test:migration:0310
      - name: Verify 0.3.1 revision migration recovery
        run: pnpm test:migration:0311
      - name: Verify 0.4.0 rhyme migration recovery
        run: pnpm test:migration:0400
      - name: Static checks
        run: pnpm check
      - name: Shell and Docker cleanup contract
        run: |
          bash -n scripts/*.sh
          ./scripts/cleanup-docker.sh --dry-run --build-cache
          test "$(./scripts/docker-image-tag.sh branch phase/0.4.0-p1-rhyme-domain 0123456789abcdef0123456789abcdef01234567 web dev)" = "0.4.0"
          test "$(./scripts/docker-image-tag.sh tag v0.4.0 0123456789abcdef0123456789abcdef01234567 web release)" = "0.4.0"
          if ./scripts/docker-image-tag.sh tag v0.4.0 0123456789abcdef0123456789abcdef01234567 web dev; then exit 1; fi
          if ./scripts/docker-image-tag.sh branch main 0123456789abcdef0123456789abcdef01234567 web release; then exit 1; fi
      - name: Unit tests
        run: pnpm test
      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Build development server production image
        run: docker build --file infra/docker/Dockerfile.web --tag lyricscloud-web-ci:${{ github.sha }} .
      - name: Build production service images
        run: |
          for service in collaboration worker migrate; do
            docker build --file infra/docker/Dockerfile.service --target "$service" --tag "lyricscloud-$service-ci:${{ github.sha }}" .
          done
      - name: Run production images with a fresh database
        run: bash scripts/verify-production-images.sh "${{ github.sha }}"
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Auth and ownership E2E
        env:
          E2E_DATABASE_URL: postgresql://lyricscloud_test:lyricscloud_test_only@127.0.0.1:5432/lyricscloud_test
        run: pnpm test:e2e
      - name: Scan build artifacts for auth secrets
        env:
          GOOGLE_CLIENT_SECRET: synthetic-e2e-client-secret
          SESSION_SECRET: synthetic-e2e-session-secret-at-least-32-bytes
          E2E_PROVIDER_TOKEN: synthetic-provider-token-never-persisted
        run: pnpm check:secrets apps/web/.next

  publish:
    name: Publish ${{ matrix.service }} image
    needs: verify
    if: (github.event_name == 'push' || inputs.publish == true) && vars.DOCKERHUB_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: infra/docker/Dockerfile.web
            target: runtime
          - service: collaboration
            dockerfile: infra/docker/Dockerfile.service
            target: collaboration
          - service: worker
            dockerfile: infra/docker/Dockerfile.service
            target: worker
          - service: migrate
            dockerfile: infra/docker/Dockerfile.service
            target: migrate
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - name: Resolve tag channel
        id: version
        run: |
          channel=dev
          if [ "${{ inputs.release }}" = "true" ]; then channel=release; fi
          version=$(./scripts/docker-image-tag.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ matrix.service }}" "$channel")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: parkingplace/lyricscloud-${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ github.sha }}
            type=raw,value=Dev
            type=raw,value=Dev-latest
            type=raw,value=Release,enable=${{ inputs.release == true }}
            type=raw,value=latest,enable=${{ inputs.release == true }}
          labels: |
            org.opencontainers.image.title=LyricsCloud ${{ matrix.service }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push multi-tagged image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=lyricscloud-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=lyricscloud-${{ matrix.service }}
