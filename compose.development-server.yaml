# Development server override: run the immutable image content without host source or dependency mounts.
services:
  migrate:
    volumes: !reset []
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    command: ["node", "apps/web/server.js"]
    environment:
      NODE_ENV: production
    volumes: !reset []
  collaboration:
    volumes: !reset []
  worker:
    volumes: !reset []
