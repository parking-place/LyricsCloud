name: lyricscloud

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.dev
  init: true
  restart: unless-stopped
  logging: *logging
  env_file:
    - path: .env
      required: false
  environment:
    CI: "true"
    NODE_ENV: development
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
    APP_VERSION: ${APP_VERSION:-1.0.0}
    BUILD_ID: ${BUILD_ID:-local}
  volumes:
    - .:/workspace
    - workspace_node_modules:/workspace/node_modules
    - pnpm_store:/pnpm/store
  networks: [app]

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [app]

  postgres_test:
    image: postgres:18-bookworm
    profiles: [test]
    logging: *logging
    environment:
      POSTGRES_DB: lyricscloud_test
      POSTGRES_USER: lyricscloud_test
      POSTGRES_PASSWORD: lyricscloud_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lyricscloud_test -d lyricscloud_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
    networks: [app]

  migrate:
    <<: *app
    restart: "no"
    command: ["pnpm", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate_test:
    <<: *app
    profiles: [test]
    restart: "no"
    command: ["pnpm", "migrate"]
    environment:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://lyricscloud_test:lyricscloud_test_only@postgres_test:5432/lyricscloud_test}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_ID: ${BUILD_ID:-local}
    depends_on:
      postgres_test:
        condition: service_healthy

  web:
    <<: *app
    command: ["pnpm", "--filter", "@lyricscloud/web", "dev"]
    secrets:
      - auth_allowed_emails
      - auth_allowlist_hmac_keyring
    environment:
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_ID: ${BUILD_ID:-local}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COLLABORATION_INTERNAL_URL: http://collaboration:3001
      GOOGLE_ISSUER: ${GOOGLE_ISSUER:-https://accounts.google.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-CHANGE_ME.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-CHANGE_ME}
      SESSION_SECRET: ${SESSION_SECRET:-CHANGE_ME_AT_LEAST_32_RANDOM_BYTES}
      AUTH_ALLOWED_EMAILS_FILE: /run/secrets/auth_allowed_emails
      AUTH_ALLOWLIST_FORMAT: hmac-v1
      AUTH_ALLOWLIST_ENVIRONMENT: development
      AUTH_ALLOWLIST_HMAC_KEYRING_FILE: /run/secrets/auth_allowlist_hmac_keyring
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  collaboration:
    <<: *app
    command: ["pnpm", "--filter", "@lyricscloud/collaboration", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      COLLABORATION_PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@lyricscloud/worker", "dev"]
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      WORKER_HEALTH_PORT: 3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  app:
    internal: false

volumes:
  postgres_data:
  backup_data:
  workspace_node_modules:
  pnpm_store:

secrets:
  auth_allowed_emails:
    file: ./.private/runtime/auth_allowed_emails
  auth_allowlist_hmac_keyring:
    file: ./.private/runtime/auth_allowlist_hmac_keyring
